# SPDX-License-Identifier: BSD-3-Clause
#
# West manifest for standalone sof-topologies usage.
#
# Usage & update conventions:
# - Standalone topology workspace (uses local include/kernel/abi.h, no SOF/Zephyr clone):
#     west init -l sof-topologies && west update
#   Update `self` (sof-topologies) with Git, then sync ALSA dependencies with West:
#     git -C sof-topologies pull && west update
# - Full SOF workspace (`west init -l sof`):
#     `sof/west.yml` imports `alsa-lib` and `alsa-utils` from this file so the
#     pinned ALSA commits are maintained in a single place.

manifest:
  version: "0.13"

  defaults:
    remote: thesofproject

  remotes:
    - name: thesofproject
      url-base: https://github.com/thesofproject

  projects:
    - name: alsa-lib
      repo-path: alsa-lib
      path: alsa-lib
      revision: 08b532cd3da9ac8f683bcb4e4beb9b74c39c1782

    - name: alsa-utils
      repo-path: alsa-utils
      path: alsa-utils
      revision: 9feb22ba45b48729729c8d194aaf1bc082a6842a

  self:
    path: sof-topologies
